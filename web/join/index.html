<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildKI – Team beitreten</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #0B1622; color: #F0F4F8; margin: 0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .card { max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #8FA3B8; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 18px; background: #2563EB; color: #fff;
            text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BuildKI wird geöffnet …</h1>
    <p>Wenn BuildKI installiert ist, öffnet sich die App automatisch.<br />
       Andernfalls wirst du zum App Store weitergeleitet.</p>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6780242629">Zum App Store</a>
  </div>
  <script>
    // If the app is installed, iOS opens it via the Universal Link before this
    // page loads. Reaching this script means the app isn't installed (or it's a
    // desktop/Android browser) -> send the user to the store.
    (function () {
      var APP_STORE = "https://apps.apple.com/app/id6780242629";
      // Small delay so an in-app Universal Link handoff isn't interrupted.
      setTimeout(function () { window.location.replace(APP_STORE); }, 1200);
    })();
  </script>
</body>
</html>
